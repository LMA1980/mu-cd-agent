version: "1"
service: "mu-cd-agent"

target_nodes:
  - "node-a"
  - "node-b"
  - "worker-riscv64"

lease_ttl_seconds: 300
warmup_timeout_seconds: 30
bake_window_seconds: 60
max_error_logs: 0
max_p99_latency_ms: 250.0
integration_tests: "all"

ab_rules:
  btrfs_snapshots: true
  keep_snapshots: 5
  auto_rollback_on_critical: true

deployment:
  target_nodes:
    - "node-a"
    - "node-b"
    - "worker-riscv64"
  binary: "mu-cd-agent"
  install_path: "/usr/local/bin/mu-cd-agent"
  systemd_unit: "mu-cd-agent.service"

verification:
  bake_window_secs: 60
  rollback_on_failure: true
